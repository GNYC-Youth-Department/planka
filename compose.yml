services:
  planka:
    image: ghcr.io/gnyc-youth-department/planka-gnyc:latest
    ## Uncomment the following lines to build the image locally instead of pulling from the registry
    #    build:
    #      context: .
    #      dockerfile: Dockerfile
    container_name: planka
    restart: on-failure
    volumes:
      - data:/app/data
      # - ./terms:/app/terms/custom
    ports:
      - ${EXTERNAL_PORT:-3000}:1337
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: planka-postgres
    restart: on-failure
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=$POSTGRES_DB
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d planka" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data:
  db-data:
